name: Deep Security Audit (GPT-5.4)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          # Secret inheritance
          OPENAI_KEY: ${{ secrets.OPAI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Model Config
          CONFIG.MODEL: "gpt-5.4"
          PR_REVIEWER.LANGUAGE: "zh"
          PR_REVIEWER.ADAPTIVE_REVIEW: "true"
          CONFIG.MAX_MODEL_TOKENS: 20000
          PR_REVIEWER.MAX_TOKENS_FOR_REVIEW: 1000000

          # --- Core Audit Instructions ---
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            # ROLE: Logic Audit Expert (NOT a Compiler)
            1. CONTEXT: You only see Diff. Ignore 'Missing Import' or 'Undefined Symbol'.
            2. FOCUS: Only report logic bugs, security risks, NPEs, tenant context leaks, and async context propagation bugs.
            3. IGNORE: Syntax errors, missing packages.

            # AUDIT ATTITUDE: Guilty Until Proven Innocent
            - Report even 1% risk of NPE.
            - Assume external data is malicious.
            - Assume async execution loses ThreadLocal context unless explicit wrapping is visible.

            # OUTPUT RULES
            1. Language: Simplified Chinese (zh-CN).
            2. Format: File path -> Risk points.
            3. Style: Concise, no fluff.
            4. Only report real risk points. Do not output generic suggestions.

            # CHECKLIST (The 14 Iron Rules)
            1. Security: SQLi, XSS, IDOR. NO Token/PII in logs.
            2. Token/Session: 401 must be idempotent. Single global logout.
            3. Gateway: Forward 'Authorization'. Check case-sensitivity.
            4. Sync: Persist login state immediately.
            5. Logic: No toLowerCase/toUpperCase on IDs/Tokens. Strict path matching.
            6. Tabs: Sync via StorageEvent. Retry on network switch.
            7. Refresh Token: Share Promise to prevent storm. Backoff on fail.
            8. Cache: HTML network-first. ServiceWorker skipWaiting.
            9. Performance: Rate limit hot keys. Lua script timeout.
            10. Redis Cluster: Assume Redis is deployed in cluster mode. Check hash slot consistency, multi-key operations on cross-slot keys, pipeline/MGET/MSET/Lua limitations, distributed lock safety, hot key amplification, resharding/migration compatibility, and no reliance on single-node commands or global key scans.
            11. Observability: TraceId required. Distinguish 401 source.
            12. Error Handling: Non-401 (500/404) must NOT trigger logout.
            13. Background: Handle 'active/refreshing/logged-out' states.
            14. Async Tenant Context:
                - Check every async boundary: CompletableFuture, Executor, ThreadPoolTaskExecutor, @Async, event listener, MQ consumer/producer callback, transaction after-commit task, scheduled task, delayed task, retry task, and manually created Thread/Runnable/Callable.
                - If the async task may access tenant mapper, tenant DB routing, Redis tenant key, UserContext, RequestContext, MDC, traceId, login user, tenantId, merchantId, or site/domain config, it must propagate tenant context explicitly.
                - Required safe patterns: TenantTaskExecutor.executeInTenantAsync(...), tenantTaskExecutor.wrapCurrentContext(...), or an equivalent project-approved wrapper that captures and restores tenant/user/MDC context.
                - Report bare CompletableFuture.supplyAsync/runAsync, commonPool usage, raw executor.submit/execute, raw @Async lambda, raw new Thread, and unwrapped Runnable/Callable when tenant-related context may be used inside.
                - Check context cleanup in finally blocks. Context must be restored or cleared after task completion to prevent tenant pollution across reused threads.
                - Pay special attention to CallerRunsPolicy: if the rejected task runs in the submitter thread, it must not clear, overwrite, or pollute the submitter thread's tenant/UserContext/MDC.
                - Check nested async calls. Passing context once at the outer layer is not enough if inner async tasks use raw executors or commonPool.
                - Check transaction-after-commit and event/MQ handlers. They must not assume request ThreadLocal still exists after the request thread ends.
                - If tenantId is captured as a method parameter, verify it is the correct tenant source and is used to set full tenant context before accessing tenant resources.
                - If context propagation is missing or ambiguous, report it as a real bug: possible cross-tenant data access, wrong Redis key, wrong DB routing, missing traceId, or context leak.

          PR_REVIEWER.NUM_CODE_SUGGESTIONS: 0
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "true"
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER.PERSISTENT_COMMENT: "false"
